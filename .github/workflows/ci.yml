name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Syntax check
        run: |
          for f in lib/*.js seed/index.js src/*/app.js; do
            node --check "$f"
          done

      - name: Validate docker-compose
        run: docker compose -f infra/docker-compose.yml config -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose -f infra/docker-compose.yml up -d --build

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 100

      - name: Teardown
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
