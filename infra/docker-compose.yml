x-app-base: &app-base
  build:
    context: ..
    dockerfile: Dockerfile
  image: collect-ingest-observe-app:local
  restart: unless-stopped

x-pg-env: &pg-env
  POSTGRES_HOST: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres

services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.74.0
    container_name: otel-col
    restart: unless-stopped
    command: ["--config=/etc/otelcol-config.yml"]
    volumes:
      - ./otel/otelcol-config.yml:/etc/otelcol-config.yml
    ports:
      - "4317:4317" # OTLP over gRPC receiver
      - "4318:4318" # OTLP over HTTP receiver
      - "8888:8888" # Metrics endpoint
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "9000:9000"
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./clickhouse:/var/lib/clickhouse
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/network.xml
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:9.4.3
    container_name: grafana
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    depends_on:
      clickhouse:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./pg:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates and seeds the Postgres tables, then exits
  seed:
    <<: *app-base
    restart: "no"
    command: ["node", "--require", "./lib/otel.js", "seed"]
    environment:
      <<: *pg-env
      OTEL_SERVICE_NAME: seed-service
      OTEL_COLLECTOR_URL: http://otelcol:4318/v1
    depends_on:
      postgres:
        condition: service_healthy

  users:
    <<: *app-base
    command: ["node", "--require", "./lib/otel.js", "src/users/app.js"]
    environment:
      <<: *pg-env
      OTEL_SERVICE_NAME: user-service
      OTEL_COLLECTOR_URL: http://otelcol:4318/v1
      PORT: "9998"
    depends_on:
      otelcol:
        condition: service_started
      seed:
        condition: service_completed_successfully

  orders:
    <<: *app-base
    command: ["node", "--require", "./lib/otel.js", "src/orders/app.js"]
    environment:
      <<: *pg-env
      OTEL_SERVICE_NAME: orders-service
      OTEL_COLLECTOR_URL: http://otelcol:4318/v1
      PORT: "9997"
    depends_on:
      otelcol:
        condition: service_started
      seed:
        condition: service_completed_successfully

  gateway:
    <<: *app-base
    command: ["node", "--require", "./lib/otel.js", "src/gateway/app.js"]
    ports:
      - "9999:9999"
    environment:
      <<: *pg-env
      OTEL_SERVICE_NAME: gateway-service
      OTEL_COLLECTOR_URL: http://otelcol:4318/v1
      PORT: "9999"
      USERS_URL: http://users:9998/
      ORDERS_URL: http://orders:9997/
    depends_on:
      users:
        condition: service_started
      orders:
        condition: service_started
